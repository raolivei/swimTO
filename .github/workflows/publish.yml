name: Publish & Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag release"
        required: true

jobs:
  git-tag-release:
    permissions:
      contents: write
    uses: ./.github/workflows/git-tag-and-release.yaml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}

  build-api:
    needs: git-tag-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-release.yaml
    with:
      dockerfile: apps/api/Dockerfile
      image_name: swimto-api
      image_tag: ${{ needs.git-tag-release.outputs.new_tag }}
      docker_artifact_name: swimto-api-${{ needs.git-tag-release.outputs.new_tag }}
      packages_dir: swimto-api-dist
      context: .
      arch: arm64,amd64
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    needs: git-tag-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-release.yaml
    with:
      dockerfile: apps/web/Dockerfile
      image_name: swimto-web
      image_tag: ${{ needs.git-tag-release.outputs.new_tag }}
      docker_artifact_name: swimto-web-${{ needs.git-tag-release.outputs.new_tag }}
      packages_dir: swimto-web-dist
      context: apps/web
      arch: arm64,amd64
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [git-tag-release, build-api, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image_name: [swimto-api, swimto-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image_name }}-${{ needs.git-tag-release.outputs.new_tag }}-amd64
          path: ${{ matrix.image_name }}-dist
        continue-on-error: true

      - name: Download artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image_name }}-${{ needs.git-tag-release.outputs.new_tag }}-arm64
          path: ${{ matrix.image_name }}-dist
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        run: |
          TAG="${{ needs.git-tag-release.outputs.new_tag }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:$TAG"
          ARTIFACT="${{ matrix.image_name }}-$TAG"
          MANIFEST_ARGS=()

          for arch in amd64 arm64; do
            if [ -f "${{ matrix.image_name }}-dist/${ARTIFACT}-${arch}.tar" ]; then
              docker load -i "${{ matrix.image_name }}-dist/${ARTIFACT}-${arch}.tar"
              LOADED=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "${{ matrix.image_name }}.*${arch}" | head -1)
              docker tag "$LOADED" "${IMAGE}-${arch}"
              docker push "${IMAGE}-${arch}"
              MANIFEST_ARGS+=("${IMAGE}-${arch}")
            fi
          done

          if [ ${#MANIFEST_ARGS[@]} -gt 0 ]; then
            docker manifest create "$IMAGE" "${MANIFEST_ARGS[@]}" || true
            docker manifest push "$IMAGE"
            echo "Published: $IMAGE"
          fi
