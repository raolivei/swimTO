name: Git Tag and Release

on:
  workflow_call:
    inputs:
      version:
        description: "Version to tag release"
        required: true
        type: string
    outputs:
      new_tag:
        description: "The new tag that was created"
        value: ${{ jobs.tag-release.outputs.new_tag }}

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.normalize.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize version
        id: normalize
        run: |
          VERSION="${{ inputs.version }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          # Ensure it starts with 'v'
          NEW_TAG="v${VERSION}"
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "Normalized version: ${NEW_TAG}"

      - name: Check if tag exists
        id: check-tag
        run: |
          TAG="${{ steps.normalize.outputs.new_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi

      - name: Create git tag
        id: tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.normalize.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "new_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Use existing tag
        id: tag-existing
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          TAG="${{ steps.normalize.outputs.new_tag }}"
          echo "new_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.new_tag || steps.tag-existing.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag || steps.tag-existing.outputs.new_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
