name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "VERSION"
      - ".github/workflows/build-and-push.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create semver git tag (cut a prod release)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      create_tag: ${{ steps.gate.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        run: |
          # Manual release override via workflow_dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "create_tag=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Automatic gate: only tag when VERSION file was part of this push
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^VERSION$'; then
            echo "create_tag=true" >> $GITHUB_OUTPUT
          else
            echo "create_tag=false" >> $GITHUB_OUTPUT
          fi

  build-api:
    needs: check-version
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: swimto-api
      context: .
      dockerfile: apps/api/Dockerfile
      create-git-tag: ${{ needs.check-version.outputs.create_tag == 'true' }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    needs: check-version
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: swimto-web
      context: ./apps/web
      runs-on: ubuntu-latest
      create-git-tag: ${{ needs.check-version.outputs.create_tag == 'true' }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
