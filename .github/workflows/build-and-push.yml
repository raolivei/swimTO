name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "VERSION"
      - ".github/workflows/build-and-push.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
  workflow_dispatch:

permissions:
  # Required by raolivei/github-workflows docker-build.yml (nested job may request contents: write).
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: swimto-api
      context: .
      dockerfile: apps/api/Dockerfile
      # Auto-bump PATCH from the highest existing git tag on every push
      # to main; mirror as ``v$VERSION`` git tag for traceability.
      create-git-tag: true
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: swimto-web
      context: ./apps/web
      # ARC Pi runners hit npm flake/timeouts; web is static nginx — build on GitHub-hosted.
      runs-on: ubuntu-latest
      # Same auto-bump logic; the second job's git push is a no-op
      # (the first job creates the tag, idempotency is built-in).
      create-git-tag: true
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
