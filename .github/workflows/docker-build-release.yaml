name: Docker Build Release

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string
      image_name:
        description: "Name of the Docker image"
        required: true
        type: string
      image_tag:
        description: "Tag for the Docker image"
        required: true
        type: string
      docker_artifact_name:
        description: "Name for the Docker artifact"
        required: true
        type: string
      packages_dir:
        description: "Directory to store packages"
        required: true
        type: string
      context:
        description: "Build context path"
        required: true
        type: string
      arch:
        description: "Comma-separated list of architectures (e.g., arm64,amd64)"
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create packages directory
        run: mkdir -p ${{ inputs.packages_dir }}

      - name: Check if architecture should be built
        id: check-arch
        run: |
          ARCH_STRING="${{ inputs.arch }}"
          if [[ "$ARCH_STRING" == *"${{ matrix.arch }}"* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building for ${{ matrix.arch }}"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.arch }} (not in requested architectures: $ARCH_STRING)"
          fi

      - name: Determine platform
        id: platform
        if: steps.check-arch.outputs.build == 'true'
        run: |
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            amd64)
              echo "platform=linux/amd64" >> $GITHUB_OUTPUT
              ;;
            arm64)
              echo "platform=linux/arm64" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "platform=linux/$ARCH" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build Docker image
        if: steps.check-arch.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ steps.platform.outputs.platform }}
          push: false
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ inputs.packages_dir }}/${{ inputs.docker_artifact_name }}-${{ matrix.arch }}.tar

      - name: Upload Docker image artifact
        if: steps.check-arch.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.docker_artifact_name }}-${{ matrix.arch }}
          path: ${{ inputs.packages_dir }}/${{ inputs.docker_artifact_name }}-${{ matrix.arch }}.tar
          retention-days: 7
