---
# Middleware for API path rewriting (removes /api prefix)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-path-rewrite
  namespace: swimto
spec:
  replacePathRegex:
    regex: "^/api(/.*?)/?$"
    replacement: "$1/"
---
# Middleware for HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: swimto
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Local domain Ingress (swimto.eldertree.local)
# ExternalDNS annotation ensures DNS record is created in Pi-hole via RFC2136
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swimto
  namespace: swimto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: swimto-redirect-https@kubernetescrd,swimto-api-path-rewrite@kubernetescrd
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    external-dns.alpha.kubernetes.io/hostname: swimto.eldertree.local
  labels:
    app: swimto
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swimto.eldertree.local
      secretName: swimto-tls
  rules:
    - host: swimto.eldertree.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: swimto-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swimto-web-service
                port:
                  number: 3000
---
# Public domain Ingress (swimto.eldertree.xyz - legacy)
# Uses Cloudflare Origin Certificate - HTTPS termination handled by Cloudflare
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swimto-public
  namespace: swimto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: swimto-api-path-rewrite@kubernetescrd
    external-dns.alpha.kubernetes.io/hostname: swimto.eldertree.xyz
  labels:
    app: swimto
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swimto.eldertree.xyz
      secretName: swimto-cloudflare-origin-tls
  rules:
    - host: swimto.eldertree.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: swimto-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swimto-web-service
                port:
                  number: 3000
---
# Primary public domain Ingress (swimto.app)
# Uses Cloudflare Origin Certificate - HTTPS termination handled by Cloudflare
# This is the main production domain for the app
# NOTE: After purchasing swimto.app domain:
# 1. Add domain to Cloudflare
# 2. Create Cloudflare Origin Certificate for swimto.app
# 3. Create k8s secret: kubectl create secret tls swimto-app-tls --cert=origin.pem --key=origin-key.pem -n swimto
# 4. Configure DNS in Cloudflare to point to your server's public IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swimto-app
  namespace: swimto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: swimto-api-path-rewrite@kubernetescrd
  labels:
    app: swimto
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swimto.app
      secretName: swimto-app-tls
  rules:
    - host: swimto.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: swimto-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swimto-web-service
                port:
                  number: 3000
